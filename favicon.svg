<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Warm cream background matching the site's #F5F2EC palette -->
  <rect width="32" height="32" rx="3" ry="3" fill="#F5F2EA"/>

  <!-- XP monogram in a refined serif style -->
  <!-- X: elegant tapered strokes with thicker center (optical serif feel) -->
  <!-- Thin diagonal top-left to bottom-right -->
  <line x1="5" y1="6" x2="13.5" y2="26" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Thick diagonal top-right to bottom-left -->
  <line x1="13.5" y1="6" x2="5" y2="26" stroke="#1C1C2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Hair-line separator -->
  <line x1="16.5" y1="7" x2="16.5" y2="25" stroke="#1C1C2E" stroke-width="0.5" opacity="0.25"/>

  <!-- P: vertical stem -->
  <line x1="18.5" y1="6" x2="18.5" y2="26" stroke="#1C1C2E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- P bowl (upper only, matching the large XP on the site) -->
  <path d="M18.5 6 C18.5 6 27.5 6.5 27.5 12 C27.5 17.5 18.5 17 18.5 17" 
        fill="none" stroke="#1C1C2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
